[project]
name = "assembler"
version = "0.1.0"
description = "Fill deal data: read the os_fill_* reporting views and write the results into the deal-library models."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "china-model",
    "dateparser>=1.2.0",
    "lenses>=1.2.0",
    "peewee>=4.5.1,<5",
    "psycopg[binary]>=3.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
    "toolz>=1.0.0",
]

[project.optional-dependencies]
# Only needed by fillWaterfall / calibrateTheName, which call an
# OpenAI-compatible endpoint to merge waterfall extracts.
llm = ["openai>=1.0"]

[project.scripts]
assembler = "assembler.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assembler"]

[tool.uv.sources]
china-model = { workspace = true }
