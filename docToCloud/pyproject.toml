[project]
name = "doctocloud"
version = "0.1.0"
description = "Scan chinabond.com.cn and sync missing ABS/MBS documents to Qiniu."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "china-model",
    "python-dotenv>=1.0.0",
    "qiniu>=7.13.0",
    "requests>=2.31.0",
]

[tool.uv.sources]
china-model = { workspace = true }

[project.scripts]
doctocloud = "main:main"
