name: Deploy DEV FastAPI to VPS

on:
  push:
    branches:
      - dev   # 如果你的主分支叫 master，请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR=/home/xiaoyu/repo/absbox.cloud-dev
            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              mkdir -p "$DEPLOY_DIR"
              git clone --branch dev https://github.com/absbox/china_abs.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart absbox-cloud-dev
