name: Deploy DEV FastAPI to VPS

on:
  push:
    branches:
      - dev   # 如果你的主分支叫 master，请改成 master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd /home/xiaoyu/repo/absbox.cloud-dev             # 替换为你的项目路径
            git fetch origin
            git reset --hard origin/dev       # 如果主分支是 master，改成 origin/master
            ./venv/bin/pip install -r requirements.txt   # 替换 venv 路径
            sudo systemctl restart absbox-cloud-dev       # 替换为你的 systemd 服务名
