[project]
name = "absbox-cloud"
version = "0.1.0"
description = "FastAPI web app for browsing Chinese credit ABS deals, analytics and projections."
requires-python = ">=3.13"
dependencies = [
    "china-model",
    "beautifulsoup4>=4.13.0",
    "bidict>=0.23.0",
    "dateparser>=1.2.0",
    "fastapi>=0.116.0",
    "fire>=0.7.0",
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "htpy>=25.10.0",
    "lenses>=1.2.0",
    "line-profiler>=4.2.0",
    "markupsafe>=3.0.0",
    "mistune>=3.1.0",
    "more-itertools>=10.6.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "peewee>=4.5.1,<5",
    "profiling-decorator>=0.0.6",
    "psycopg[binary]>=3.3.0",
    "psycopg-pool>=3.2.0",
    "pydantic>=2.11.0",
    "pyecharts>=2.0.0",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.0.0",
    "pyxirr>=0.10.0",
    "rich>=13.9.0",
    "scipy>=1.16.0",
    "tenacity>=9.1.0",
    "toolz>=1.0.0",
    "uvicorn[standard]>=0.35.0",
]

[tool.uv.sources]
china-model = { workspace = true }
