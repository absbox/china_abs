[project]
name = "dashboard"
version = "0.1.0"
description = "Command dashboard for the china-abs pipeline: manages, health-checks and calls the other subprojects, rendering results as markdown."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.10.0,<4",
    "beautifulsoup4>=4.13.0",
    "china-model",
    "more-itertools>=10.6.0",
    "pdf-inspector>=1.20.0",
    "pgmq>=0.1.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.0",
    "qiniu>=7.13.0",
    "requests>=2.31.0",
    "rich>=13.9.0",
    "sqlalchemy>=2.0.0",
    "toolz>=1.0.0",
]

[tool.uv.sources]
china-model = { workspace = true }
