[project]
name = "tomarkdown"
version = "0.1.0"
description = "Download outstanding PDF files from Qiniu and convert them to Markdown."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "china-model",
    "pdf-inspector>=1.20.0",
    "python-dotenv>=1.0.0",
    "qiniu>=7.13.0",
]

[tool.uv.sources]
china-model = { workspace = true }

[project.scripts]
tomarkdown = "main:main"
